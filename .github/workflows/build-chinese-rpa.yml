name: Build Chinese RPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "游戏版本号，例如 v21.0.0-wip.7944（无需填写 T/P/R 编号）"
        required: true
        type: string
      release_type:
        description: "发布类型（T：测试版，P：预发行版，R：发行版）"
        required: true
        type: choice
        default: "测试版"
        options:
          - "测试版"
          - "预发行版"
          - "发行版"
      official_package:
        description: "官方原包处理（默认复制校验后删除旧原包，仅最新同版本发行版保留）"
        required: true
        type: choice
        default: "复制并仅保留最新原包"
        options:
          - "复制并仅保留最新原包"
          - "复制官方原包"
          - "引用原包下载链接"
          - "不复用"
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout translation sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Ren'Py 8.5.3 SDK
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output renpy-sdk.tar.bz2 \
            https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
          echo "eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45  renpy-sdk.tar.bz2" | sha256sum --check
          tar -xjf renpy-sdk.tar.bz2

      - name: Compile translation scripts
        shell: bash
        run: |
          mkdir -p build/game
          cp -R tl build/game/tl
          cp -R mods build/game/mods
          ./renpy-8.5.3-sdk/renpy.sh build compile

      - name: Build and verify zh_hans.rpa
        run: python tools/build_rpa.py --root build/game --output dist/zh_hans.rpa

      - name: Verify zh_hans.rpa
        run: python tools/build_rpa.py --root build/game --output dist/zh_hans.rpa --verify-only

      - name: Upload zh_hans.rpa
        uses: actions/upload-artifact@v7
        with:
          name: summertime-saga-chinese-rpa-${{ github.sha }}
          path: dist/zh_hans.rpa
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # 串行分配编号与创建 Release，避免两个发布使用相同编号。
      group: publish-chinese-rpa
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout release tools
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Choose next release number
        if: github.event_name == 'workflow_dispatch'
        id: next-release
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: python tools/next_release.py

      - name: Find previous official package of the same game version
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ steps.next-release.outputs.tag }}
          REUSE_MODE: ${{ inputs.official_package }}
        run: python tools/reuse_official_package.py --prepare

      - name: Download built RPA
        uses: actions/download-artifact@v8
        with:
          name: summertime-saga-chinese-rpa-${{ github.sha }}
          path: dist

      - name: Publish zh_hans.rpa to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EXISTING_TAG: ${{ github.event.release.tag_name }}
          NEXT_TAG: ${{ steps.next-release.outputs.tag }}
          NEXT_TITLE: ${{ steps.next-release.outputs.title }}
          PRERELEASE: ${{ steps.next-release.outputs.prerelease }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # 发布已有 Release 时只更新附件，不另行分配编号。
          if [[ "$EVENT_NAME" == "release" ]]; then
            gh release upload "$EXISTING_TAG" dist/zh_hans.rpa --clobber --repo "$GITHUB_REPOSITORY"
          else
            flags=(--latest)
            if [[ "$PRERELEASE" == "true" ]]; then
              flags=(--prerelease --latest=false)
            fi
            # 新编号始终创建新 Release，不覆盖已有编号。
            gh release create "$NEXT_TAG" dist/zh_hans.rpa \
              --title "$NEXT_TITLE" \
              --target "$TARGET_SHA" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          fi

      - name: Reuse official game package
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/reuse_official_package.py --apply
