name: Build Chinese RPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发行版版本号（将作为标签），例如 v21.0.0-wip.7944"
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout translation sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Ren'Py 8.5.3 SDK
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output renpy-sdk.tar.bz2 \
            https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
          echo "eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45  renpy-sdk.tar.bz2" | sha256sum --check
          tar -xjf renpy-sdk.tar.bz2

      - name: Compile translation scripts
        shell: bash
        run: |
          mkdir -p build/game
          cp -R tl build/game/tl
          cp -R mods build/game/mods
          ./renpy-8.5.3-sdk/renpy.sh build compile

      - name: Build and verify zh_hans.rpa
        run: python tools/build_rpa.py --root build/game --output dist/zh_hans.rpa

      - name: Verify zh_hans.rpa
        run: python tools/build_rpa.py --root build/game --output dist/zh_hans.rpa --verify-only

      - name: Upload zh_hans.rpa
        uses: actions/upload-artifact@v7
        with:
          name: summertime-saga-chinese-rpa-${{ github.sha }}
          path: dist/zh_hans.rpa
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download built RPA
        uses: actions/download-artifact@v8
        with:
          name: summertime-saga-chinese-rpa-${{ github.sha }}
          path: dist

      - name: Publish zh_hans.rpa to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.version }}"
            # 去掉首尾空白
            VERSION="${VERSION#"${VERSION%%[![:space:]]*}"}"
            VERSION="${VERSION%"${VERSION##*[![:space:]]}"}"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "::error::版本号不能为空"
            exit 1
          fi

          echo "Release 标签: $VERSION"
          echo "Release 名称: $VERSION Chinese Translation"

          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $VERSION 已存在，仅更新附件"
            gh release upload "$VERSION" dist/zh_hans.rpa \
              --clobber \
              --repo "$REPO"
          else
            echo "创建 Release $VERSION"
            gh release create "$VERSION" dist/zh_hans.rpa \
              --title "$VERSION Chinese Translation" \
              --target "${{ github.sha }}" \
              --generate-notes \
              --repo "$REPO"
          fi
